name: Render Arthur Visual Checkpoints

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - "scripts/arthur_lab_short.py"
      - ".github/workflows/render-arthur-checkpoints.yml"

permissions:
  contents: read

concurrency:
  group: arthur-checkpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoints:
    name: Build and render five review frames
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender libegl1 libgl1
      - name: Build scene
        run: |
          mkdir -p build review
          blender --background --python scripts/arthur_lab_short.py -- \
            --build "$GITHUB_WORKSPACE/build/arthur-lab.blend"
      - name: Render checkpoint frames
        run: |
          for frame in 30 72 96 185 275 405; do
            blender --background build/arthur-lab.blend \
              -o "$GITHUB_WORKSPACE/review/frame_####" \
              -F PNG \
              -f "$frame"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arthur-lab-checkpoints
          path: review/*.png
          retention-days: 7
