name: Render Arthur Anime Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - "scripts/arthur_anime_gate.py"
      - "scripts/arthur_reference_gate.py"
      - ".github/workflows/render-arthur-anime-gate.yml"

permissions:
  contents: read

concurrency:
  group: arthur-anime-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anime-body-gate:
    name: Render approved Arthur reference design
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libgl1
          curl --fail --location --retry 3 \
            --output /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar --extract --xz --file /tmp/blender.tar.xz --directory /tmp
          echo "/tmp/blender-4.2.0-linux-x64" >> "$GITHUB_PATH"
      - name: Fetch MB-Lab body and rig library
        run: |
          git clone --depth 1 --branch 1_8_1 \
            https://github.com/animate1978/MB-Lab.git \
            "$RUNNER_TEMP/MB-Lab"
      - name: Build approved reference character and scene
        run: |
          mkdir -p build/review
          blender --background --python scripts/arthur_reference_gate.py -- \
            --mblab "$RUNNER_TEMP/MB-Lab" \
            --output "$GITHUB_WORKSPACE/build/review" \
            --blend "$GITHUB_WORKSPACE/build/arthur-reference-gate.blend"
      - name: Render transformation and fight motion proof
        run: |
          mkdir -p build/motion
          blender --background build/arthur-reference-gate.blend \
            -o "$GITHUB_WORKSPACE/build/motion/frame_####" \
            -F PNG \
            -s 1 -e 290 -a
          ffmpeg -y -framerate 15 \
            -pattern_type glob -i 'build/motion/frame_*.png' \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -preset medium -crf 18 \
            -pix_fmt yuv420p -movflags +faststart \
            build/arthur-reference-lab-fight-proof.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: arthur-reference-cartoon
          path: |
            build/review/*.png
            build/arthur-reference-lab-fight-proof.mp4
            build/arthur-reference-gate.blend
          retention-days: 7
